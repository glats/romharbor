version: "3"

tasks:
  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  format:
    desc: Format source code
    cmds:
      - go tool -modfile=./tools/go.tool.mod gofumpt -l -w .

  lint:
    desc: Analyze code style, errors and layer dependencies
    cmds:
      - go tool -modfile=./tools/go.tool.mod golangci-lint run ./...

  mock:
    desc: Generate test mocks
    vars:
      MOCKERY_YAML: '{{.MOCKERY_YAML | default "./config/mockery.yaml"}}'
    cmds:
      - go tool -modfile=./tools/go.tool.mod mockery --config={{.MOCKERY_YAML}}

  generate:
    desc: Generate provider clients and bob models from the migrations
    vars:
      BOB_CONFIG_FILE: '{{.BOB_CONFIG_FILE | default "./config/bobgen.yaml"}}'
    cmds:
      - task: generate-providers
      - |
        set -euo pipefail
        rm -rf .tmp && mkdir -p .tmp
        go tool -modfile=./tools/go.tool.mod dbmate --url "sqlite:{{.ROOT_DIR}}/.tmp/gen.db" --migrations-dir ./internal/adapter/sqlite/migrations --no-dump-schema up
        cd internal/adapter/sqlite
        SQLITE_DSN="{{.ROOT_DIR}}/.tmp/gen.db" go tool -modfile={{.ROOT_DIR}}/tools/go.tool.mod bobgen-sqlite -c "{{.ROOT_DIR}}/{{.BOB_CONFIG_FILE}}"
        cd ../../..
        rm -rf .tmp

  generate-providers:
    desc: Generate HTTP clients from the consumer-maintained provider contracts
    cmds:
      - go tool -modfile=./tools/go.tool.mod oapi-codegen --config config/oapi-codegen/archiveorg.yaml contract/openapi/archiveorg.yaml
      - go tool -modfile=./tools/go.tool.mod oapi-codegen --config config/oapi-codegen/dlarchive.yaml contract/openapi/dlarchive.yaml
      - go tool -modfile=./tools/go.tool.mod oapi-codegen --config config/oapi-codegen/lolroms.yaml contract/openapi/lolroms.yaml
      - go tool -modfile=./tools/go.tool.mod gofumpt -w internal/adapter/romsource/archiveorgapi/client.gen.go internal/adapter/romsource/dlarchiveapi/client.gen.go internal/adapter/romsource/lolromsapi/client.gen.go

  check-providers:
    desc: Check provider client generation without modifying the worktree
    cmds:
      - |
        set -eu
        scratch=$(mktemp -d)
        trap 'rm -rf "$scratch"' EXIT
        for provider in archiveorg dlarchive lolroms; do
          sed "s|^output:.*|output: $scratch/$provider.go|" "config/oapi-codegen/$provider.yaml" > "$scratch/$provider.yaml"
          go tool -modfile=./tools/go.tool.mod oapi-codegen --config "$scratch/$provider.yaml" "contract/openapi/$provider.yaml"
          go tool -modfile=./tools/go.tool.mod gofumpt -w "$scratch/$provider.go"
          diff -u "internal/adapter/romsource/${provider}api/client.gen.go" "$scratch/$provider.go"
        done

  dev-bootstrap:
    desc: Create .env from env.dist when it does not exist
    cmds:
      - test -f .env || cp env.dist .env

  dev:
    desc: Run the web server and the download worker
    deps: [dev-bootstrap]
    cmds:
      - |
        set -eu
        go run ./cmd/web &
        web_pid=$!
        go run ./cmd/worker &
        worker_pid=$!
        trap 'kill "$web_pid" "$worker_pid" 2>/dev/null || true' EXIT INT TERM
        wait "$web_pid"

  coverage:
    desc: Display coverage report
    cmds:
      - go test -coverprofile=coverage.out $(go list ./... | grep -v -e /mock -e /cmd/ -e /sqlite/models -e /sqlite/dberrors -e /sqlite/dbinfo)
      - go tool cover -func=coverage.out
