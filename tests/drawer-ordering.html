<!doctype html>
<meta charset="utf-8">
<button id="downloads-toggle">Downloads</button>
<aside id="downloads-panel"><div id="downloads-list"></div></aside>
<output id="result">PENDING</output>
<script>
  const pending = [];
  let refresh, jobsCalls = 0, fresh = false;
  window.setInterval = callback => { refresh = callback; return 1; };
  window.fetch = async url => {
    if (url === '/api/jobs') {
      jobsCalls++;
      if (jobsCalls === 1 || fresh) {
        fresh = false;
        const jobs = [{ id: 'same', title: jobsCalls === 1 ? 'Old' : 'New', status: 'done', path: 'psx/game.m3u' }];
        return Response.json({ jobs }, { headers: { ETag: 'jobs-' + jobsCalls } });
      }
      return new Response(null, { status: 304 });
    }
    return new Promise(resolve => pending.push(resolve));
  };
</script>
<script src="../internal/port/web/static/catalog.js"></script>
<script>
  const tick = () => new Promise(resolve => setTimeout(resolve, 20));
  const click = () => document.getElementById('downloads-toggle').click();
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  window.addEventListener('load', async () => {
    const result = document.getElementById('result');
    try {
      click();
      await tick();
      const old = document.querySelector('.job');
      assert(pending.length === 1, 'initial request absent');
      refresh();
      refresh();
      await tick();
      assert(pending.length === 1, 'duplicate request while old card pending');
      fresh = true;
      refresh();
      await tick();
      const current = document.querySelector('.job');
      assert(current !== old && !old.isConnected, 'fresh jobs did not detach old card');
      assert(pending.length === 2, 'new card did not request readiness independently');
      pending[1](Response.json({ status: 'incomplete', missing_files: ['late-track.bin'], bundle_ready: false }));
      await tick();
      pending[0](Response.json({ status: 'complete', bundle_ready: true }));
      await tick();
      assert(!old.querySelector('.job-readiness'), 'late readiness rendered into detached card');
      assert(current.textContent.includes('late-track.bin') && !current.querySelector('.job-bundle'), 'late readiness overwrote new card');
      click();
      refresh();
      await tick();
      assert(pending.length === 2, 'closed drawer fetched readiness');
      result.textContent = 'PASS: in-flight request deduplicated; late response ignored; closed drawer idle.';
    } catch (error) {
      result.textContent = 'FAIL: ' + error.message;
    }
  });
</script>
