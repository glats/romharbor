version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/domain
        app:
          list-mode: strict
          files:
            - "**/internal/app/**"
            - "!$test"
            - "!**/internal/app/mock/**"
          allow:
            - $gostd
            - app.ddd/internal/adapter$
            - app.ddd/internal/domain
            - app.ddd/internal/app
            - app.ddd/internal/common
        adapter-contracts:
          list-mode: strict
          files:
            - "**/internal/adapter/*.go"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/domain
        port:
          list-mode: strict
          files:
            - "**/internal/port/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/domain
            - app.ddd/internal/app$
            - app.ddd/internal/app/command
            - app.ddd/internal/app/query
            - app.ddd/internal/port
        service:
          list-mode: strict
          files:
            - "**/internal/service/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/adapter$
            - app.ddd/internal/domain
            - app.ddd/internal/app
            - app.ddd/internal/common
            - app.ddd/internal/service
        adapter-sqlite:
          list-mode: strict
          files:
            - "**/internal/adapter/sqlite/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/adapter$
            - app.ddd/internal/domain
            - app.ddd/internal/adapter/sqlite
            - github.com/stephenafamo/bob
            - github.com/aarondl/opt
            - github.com/amacneil/dbmate
            - github.com/mattn/go-sqlite3
        adapter-config:
          list-mode: strict
          files:
            - "**/internal/adapter/config/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/adapter/config
            - github.com/caarlos0/env
        adapter-rom:
          list-mode: strict
          files:
            - "**/internal/adapter/romcache/**"
            - "**/internal/adapter/romdownloads/**"
            - "**/internal/adapter/romfetch/**"
            - "**/internal/adapter/romlistings/**"
            - "**/internal/adapter/romlibrary/**"
            - "**/internal/adapter/romsource/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/adapter$
            - app.ddd/internal/domain
            - app.ddd/internal/adapter/romsource/archiveorgapi
            - app.ddd/internal/adapter/romsource/dlarchiveapi
            - app.ddd/internal/adapter/romsource/lolromsapi
            - app.ddd/internal/adapter/romfetch
            - github.com/PuerkitoBio/goquery
            - github.com/bodgit/sevenzip
            - github.com/oapi-codegen/runtime
        adapter-http-confined:
          files:
            - "**/internal/adapter/**"
            - "!$test"
            - "!**/internal/adapter/romsource/archiveorgapi/**"
            - "!**/internal/adapter/romsource/dlarchiveapi/**"
            - "!**/internal/adapter/romsource/lolromsapi/**"
            - "!**/internal/adapter/romfetch/**"
          deny:
            - pkg: net/http
              desc: "Outbound HTTP belongs to a generated client built from a contract in contract/openapi, or to the one confined download package. Model the provider operation in its OpenAPI contract and call the generated client instead of building requests by hand."
        no-external-processes:
          files:
            - "**/*.go"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: "Do not run external programs. Use a Go library behind an adapter port so the call is bounded, cancellable and portable."
        common:
          list-mode: strict
          files:
            - "**/internal/common/**"
            - "!$test"
          allow:
            - $gostd
            - app.ddd/internal/common
            - github.com/rs/zerolog

formatters:
  enable:
    - gofumpt
